services:
  wp:
    image: wordpress:${WP_VERSION}
    restart: always
    depends_on:
      - db
    volumes:
      - ./data/wp_php.ini:/usr/local/etc/php/conf.d/conf.ini
      - ./data/www:/var/www/html
    ports:
      - "${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${USERNAME}
      WORDPRESS_DB_PASSWORD: ${PASSWORD}
      WORDPRESS_DB_NAME: wordpress

  db:
    image: mysql:${MYSQL_VERSION}
    restart: always
    volumes:
      - ./data/sql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${PASSWORD}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: ${USERNAME}
      MYSQL_PASSWORD: ${PASSWORD}

  pma:
    depends_on:
      - db
    image: phpmyadmin:${PHPMYADMIN_VERSION}
    restart: always
    ports:
      - "${PHPMYADMIN_PORT}:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${PASSWORD}

  sftp:
    image: atmoz/sftp
    restart: always
    ports:
      - "${SFTP_PORT}:22"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./data/sftp/ssh_host_rsa_key:/etc/ssh/ssh_host_rsa_key
      - ./data/www:/home/${USERNAME}
    command: ${USERNAME}:${PASSWORD}:33:33
